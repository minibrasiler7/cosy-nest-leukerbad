y que saber sobre el estudio y la región.","place":"Estudio 14, Haus Adlerhorst, Leukerbad","stay":"Su estancia: del {from} al {to}","network":"Red","password":"Contraseña","copy":"Copiar","copied":"Copiado","titles":{"arrival":"Llegada y salida","tv":"Televisión","trash":"Basura","parking":"Aparcamiento","guestcard":"Guest Card","walks":"Paseos","food":"Restaurantes","transport":"Transporte","emergency":"Emergencias","contact":"Contacto","checkout":"Antes de irse"},"easy":"Fácil","hard":"Difícil","photo":"Foto","map_home":"Cosy Nest (Zur Gasse 87)","map_park":"Aparcamiento Sportarena","map_walk":"Ruta a pie","tel":"Tel.","thanks":"Gracias por su visita. ¡Buen viaje de vuelta!","maps":"Fotos y ruta"}},"img":{"trash":{"src":"local-poubelles.jpg","credit":"© Google Street View","w":600,"h":466},"gorge":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Dalaschlucht_-_Leukerbad%2C_Switzerland3.jpg/960px-Dalaschlucht_-_Leukerbad%2C_Switzerland3.jpg","credit":"dconvertini, CC BY-SA 2.0","url":"https://commons.wikimedia.org/wiki/File:Dalaschlucht_-_Leukerbad,_Switzerland3.jpg","w":960,"h":640},"hamlet":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/3954_Leukerbad%2C_Switzerland_-_panoramio_%282%29.jpg/960px-3954_Leukerbad%2C_Switzerland_-_panoramio_%282%29.jpg","credit":"karico, CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:3954_Leukerbad,_Switzerland_-_panoramio_(2).jpg","w":960,"h":720},"gemmi":{"src":"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/54/Gemmi_Daubenwand_14.JPG/960px-Gemmi_Daubenwand_14.JPG","credit":"Photolovy, CC BY-SA 3.0","url":"https://commons.wikimedia.org/wiki/File:Gemmi_Daubenwand_14.JPG","w":960,"h":643}},"todo":{"keys":"Remise des clés : boîte à clés, code, où déposer les clés au départ.","wifi":"Nom du réseau et mot de passe Wi‑Fi (Espace hôte → Réglages).","trash":"Où acheter les sacs taxés, et où déposer le verre et le carton.","guestcard":"Comment la carte est remise aux voyageurs (envoyée  haut."]],"de":[["p","Der Fernseher ist ein Samsung The Frame mit 65 Zoll. Im ausgeschalteten Zustand zeigt er ein Kunstwerk: das ist der Art-Modus."],["remote",null],["ol",["Ein/Aus. Kurz drücken: vom Art-Modus zum Fernsehen wechseln. Lange drücken: ganz ausschalten.","Home: öffnet das App-Menü (Netflix, Sunrise TV …).","Steuerkreuz: navigieren. In der Mitte drücken zum Bestätigen.","Zurück: zum vorherigen Bildschirm.","Lautstärke: nach oben oder unten drücken. Drücken für Stummschaltung.","Sender: nächster oder vorheriger Sender.","Netflix: öffnet Netflix direkt."]],["h","Fernsehsender (Sunrise TV)"],["p","Drücken Sie Home (2). Wählen Sie die App Sunrise TV. Öffnen Sie «TV» und dann «TV schauen»."],["p","Der TV-Guide zeigt die Sendungen der letzten 7 und der nächsten 7 Tage. Bereits gezeigte Sendungen können Sie nachschauen."],["h","Netflix"],["p","Drücken Sie die Netflix-Taste (7). Unser Konto ist bereits angemeldet. Bitte melden Sie sich nicht ab."],["p","Die Fernbedienung reagiert nicht? Laden Sie sie mit dem USB‑C-Kabel oder legen Sie sie mit der Solarseite nach oben ans Licht."]],"en":[["p","The TV is a 65-inch Samsung The Frame. When it is off, it shows a work of art: this is Art Mode."],["remote",null],["ol",["Power. Short press: switch from Art Mode to TV. Long press: switch off completely.","Home: opens the apps menu (Netflix, Sunrise TV…).","Direction pad: move around. Press the centre to select.","Back: return to the previous screen.","Volume: push up or down. Press to mute.","Channels: next or previous channel.","Netflix: opens Netflix directly."]],["h","Watching TV channels (Sunrise TV)"],["p","Press Home (2). Choose the Sunrise TV app. Open “TV”, then “Watch TV”."],["p","The TV guide shows programmes from the last 7 days and the next 7 days. You can replay shows that have already aired."],["h","Netflix"],["p","Press the Netflix button (7). Our account is already signed in. Please do not sign out."],["p","Remote not responding? Charge it with the USB‑C cable or place it in the light, solar side up."]],"it":[["p","La televisione è una Samsung The Frame da 65 pollici. Da spenta mostra un’opera d’arte: è la modalità Art."],["remote",null],["ol",["Accensione. Pressione breve: passare dalla modalità Art alla TV. Pressione lunga: spegnere del tutto.","Home: apre il menu delle app (Netflix, Sunrise TV…).","Tasti direzionali: spostarsi. Premere al centro per confermare.","Indietro: tornare alla schermata precedente.","Volume: spingere in su o in giù. Premere per togliere l’audio.","Canali: canale successivo o precedente.","Netflix: apre direttamente Netflix."]],["h","Guardare i canali (Sunrise TV)"],["p","Premete Home (2). Scegliete l’app Sunrise TV. Aprite «TV», poi «Guarda la TV»."],["p","La guida TV mostra i programmi degli ultimi 7 giorni e dei prossimi 7. Potete rivedere le trasmissioni già andate in onda."],["h","Netflix"],["p","Premete il tasto Netflix (7). Il nostro account è già collegato. Vi preghiamo di non disconnettervi."],["p","Il telecomando non risponde? Ricaricatelo con il cavo USB‑C o mettetelo alla luce, con il lato solare verso l’alto."]],"es":[["p","La televisión es una Samsung The Frame de 65 pulgadas. Apagada, muestra una obra de arte: es el modo Arte."],["remote",null],["ol",["Encendido. Pulsación corta: pasar del modo Arte a la televisión. Pulsación larga: apagar del todo.","Home: abre el menú de aplicaciones (Netflix, Sunrise TV…).","Cruceta: moverse. Pulse el centro para confirmar.","Atrás: volver a la pantalla anterior.","Volumen: empujar hacia arriba o abajo. Pulsar para silenciar.","Canales: canal siguiente o anterior.","Netflix: abre Netflix directamente."]],["h","Ver los canales (Sunrise TV)"],["p","Pulse Home (2). Elija la aplicación Sunrise TV. Abra «TV» y luego «Ver la TV»."],["p","La guía muestra los programas de los últimos 7 días y de los próximos 7. Puede volver a ver programas ya emitidos."],["h","Netflix"],["p","Pulse el botón Netflix (7). Nuestra cuenta ya está conectada. Por favor, no cierre la sesión."],["p","¿El mando no responde? Cárguelo con el cable USB‑C o déjelo a la luz, con la cara solar hacia arriba."]]},"trash":{"fr":[["p","Sortez de l’immeuble et traversez la place. Le local à ordures est en face : une porte en bois arrondie, sous le panneau « Kunibergstrasse »."],["img","trash"],["p","Seuls les sacs taxés officiels sont acceptés. Le verre et le carton ne vont pas dans ce local."],["todo","trash"]],"de":[["p","Verlassen Sie das Haus und überqueren Sie den Platz. Der Abfallraum ist gegenüber: eine runde Holztür unter dem Schild «Kunibergstrasse»."],["img","trash"],["p","Nur offizielle Gebührensäcke sind erlaubt. Glas und Karton gehören nicht in diesen Raum."],["todo","trash"]],"en":[["p","Leave the building and cross the square. The rubbish room is opposite: a rounded wooden door under the “Kunibergstrasse” sign."],["img","trash"],["p","Only official taxed bags are accepted. Glass and cardboard do not go in this room."],["todo","trash"]],"it":[["p","Uscite dall’edificio e attraversate la piazza. Il locale rifiuti è di fronte: una porta di legno ad arco, sotto il cartello «Kunibergstrasse»."],["img","trash"],["p","Sono accettati solo i sacchi ufficiali a pagamento. Vetro e cartone non vanno in questo locale."],["todo","trash"]],"es":[["p","Salga del edificio y cruce la plaza. El cuarto de basuras está enfrente: una puerta de madera en arco, bajo el cartel «Kunibergstrasse»."],["img","trash"],["p","Solo se aceptan las bolsas oficiales de pago. El vidrio y el cartón no van en este cuarto."],["todo","trash"]]},"parking":{"fr":[["p","Devant l’immeuble, une place permet de charger et décharger vos affaires. Durée maximale : 45 minutes."],["p","Pour stationner plus longtemps : parking de la Sportarena (Römerweg 5). Tarif : CHF 14.– par jour. Il est à environ 330 m, soit 5 minutes à pied."],["map",null]],"de":[["p","Vor dem Haus gibt es einen Platz zum Ein- und Ausladen. Höchstdauer: 45 Minuten."],["p","Für längeres Parkieren: Parkhaus Sportarena (Römerweg 5). Preis: CHF 14.– pro Tag. Es liegt rund 330 m entfernt, etwa 5 Minuten zu Fuss."],["map",null]],"en":[["p","In front of the building there is a space for loading and unloading. Maximum stay: 45 minutes."],["p","For longer parking: Sportarena car park (Römerweg 5). Price: CHF 14 per day. It is about 330 m away, a 5-minute walk."],["map",null]],"it":[["p","Davanti all’edificio c’è un posto per caricare e scaricare i bagagli. Durata massima: 45 minuti."],["p","Per sostare più a lungo: parcheggio della Sportarena (Römerweg 5). Tariffa: CHF 14.– al giorno. Si trova a circa 330 m, 5 minuti a piedi."],["map",null]],"es":[["p","Delante del edificio hay una plaza para cargar y descargar. Tiempo máximo: 45 minutos."],["p","Para aparcar más tiempo: aparcamiento de la Sportarena (Römerweg 5). Precio: CHF 14 al día. Está a unos 330 m, 5 minutos a pie."],["map",null]]},"guestcard":{"fr":[["p","La Leukerbad Guest Card est incluse dans la taxe de séjour. Elle vous donne ces avantages :"],["ul",["15 % de réduction sur l’entrée aux trois centres thermaux : Leukerbad Therme, Walliser Alpentherme & SPA et Therme 51°.","10 % de réduction sur les remontées mécaniques.","Transports gratuits avec le bus local Ringjet et les lignes Leukerbad–Flaschen–Albinen et Leukerbad–Inden, y compris Rumeling et Tschingeren.","Accès gratuit au Snowpark Sportarena.","Accès gratuit aux installations sportives de la Sportarena Leukerbad (tennis, badminton, patinoire). 50 % de réduction sur le padel. La location de matériel reste payante.","Accès gratuit au court de tennis en terre battue de l’hôtel Regina Terme, de juin à octobre.","Participation gratuite à une sélection de concerts, animations et excursions de la Leukerbad Guest Card."]],["todo","guestcard"]],"de":[["p","Die Leukerbad Guest Card ist in der Kurtaxe inbegriffen. Sie bietet Ihnen diese Vorteile:"],["ul",["15 % Rabatt auf den Eintritt in die drei Thermalbäder: Leukerbad Therme, Walliser Alpentherme & SPA und Therme 51°.","10 % Rabatt auf die Bergbahnen.","Gratis Busfahrten mit dem Ortsbus Ringjet und den Linien Leukerbad–Flaschen–Albinen und Leukerbad–Inden, inklusive Rumeling und Tschingeren.","Gratis Zugang zum Snowpark Sportarena.","Gratis Zugang zu den Sportanlagen der Sportarena Leukerbad (Tennis, Badminton, Eisbahn). 50 % Rabatt auf Padel. Die Materialmiete ist kostenpflichtig.","Gratis Zugang zum Sandplatz-Tennis des Hotels Regina Terme, von Juni bis Oktober.","Gratis Teilnahme an ausgewählten Konzerten, Animationen und Ausflügen der Leukerbad Guest Card."]],["todo","guestcard"]],"en":[["p","The Leukerbad Guest Card is included in the tourist tax. It gives you these benefits:"],["ul",["15% off admission to the three thermal baths: Leukerbad Therme, Walliser Alpentherme & SPA and Therme 51°.","10% off the cable cars and ski lifts.","Free travel on the local Ringjet bus and on the Leukerbad–Flaschen–Albinen and Leukerbad–Inden lines, including Rumeling and Tschingeren.","Free access to the Snowpark Sportarena.","Free access to the Sportarena Leukerbad facilities (tennis, badminton, ice rink). 50% off padel. Equipment hire is not included.","Free access to the clay tennis court of Hotel Regina Terme, from June to October.","Free entry to a selection of concerts, events and excursions of the Leukerbad Guest Card."]],["todo","guestcard"]],"it":[["p","La Leukerbad Guest Card è inclusa nella tassa di soggiorno. Vi offre questi vantaggi:"],["ul",["15 % di sconto sull’ingresso ai tre centri termali: Leukerbad Therme, Walliser Alpentherme & SPA e Therme 51°.","10 % di sconto sugli impianti di risalita.","Trasporti gratuiti con il bus locale Ringjet e con le linee Leukerbad–Flaschen–Albinen e Leukerbad–Inden, compresi Rumeling e Tschingeren.","Accesso gratuito allo Snowpark Sportarena.","Accesso gratuito agli impianti sportivi della Sportarena Leukerbad (tennis, badminton, pista di pattinaggio). 50 % di sconto sul padel. Il noleggio dell’attrezzatura è a pagamento.","Accesso gratuito al campo da tennis in terra battuta dell’hotel Regina Terme, da giugno a ottobre.","Partecipazione gratuita a una selezione di concerti, animazioni ed escursioni della Leukerbad Guest Card."]],["todo","guestcard"]],"es":[["p","La Leukerbad Guest Card está incluida en la tasa turística. Le ofrece estas ventajas:"],["ul",["15 % de descuento en la entrada a los tres centros termales: Leukerbad Therme, Walliser Alpentherme & SPA y Therme 51°.","10 % de descuento en los remontes.","Transporte gratuito en el autobús local Ringjet y en las líneas Leukerbad–Flaschen–Albinen y Leukerbad–Inden, incluidos Rumeling y Tschingeren.","Acceso gratuito al Snowpark Sportarena.","Acceso gratuito a las instalaciones de la Sportarena Leukerbad (tenis, bádminton, pista de hielo). 50 % de descuento en pádel. El alquiler de material se paga aparte.","Acceso gratuito a la pista de tenis de tierra batida del hotel Regina Terme, de junio a octubre.","Participación gratuita en una selección de conciertos, animaciones y excursiones de la Leukerbad Guest Card."]],["todo","guestcard"]]},"walks":{"fr":[["p","Trois balades, de la plus tranquille à la plus sportive."],["walk",{"level":"easy","img":"gorge","name":"Sentier des sources thermales","facts":"2,8 km · environ 1 h","text":["Départ de la place du village. Une passerelle en acier entre dans la gorge de la Dala, à quelques mètres au-dessus du torrent. Elle mène aux sources chaudes.","Deux escaliers métalliques permettent de sortir de la gorge. Un don libre est demandé (espèces ou Twint)."]}],["walk",{"level":"easy","img":"hamlet","name":"Balade au Bodmenstübli","facts":"2 km · 45 min à 1 h","text":["Facile et très agréable : c’est notre balade préférée. Le chemin part derrière la Sportarena et suit l’ancien Römerweg.","Après le hameau de Birchen (30 min), il arrive à Bodmen. Le restaurant Bodmenstübli vous y attend avec sa terrasse. Retour par le même chemin."]}],["walk",{"level":"hard","img":"gemmi","name":"Montée de la Gemmi à pied","facts":"4,6 km · 970 m de montée · 2 h à 2 h 30","text":["Pour les sportifs, sans téléphérique. Le chemin part près de la station de la Gemmibahn. Taillé dans la falaise au XVIIIe siècle, il monte en lacets jusqu’au col, à 2350 m.","Le chemin est sécurisé mais exposé : bonnes chaussures et pas de vertige. En haut, faites le tour du lac Daubensee. Redescendez en téléphérique (10 % de réduction avec la Guest Card)."]}]],"de":[["p","Drei Wanderungen, von gemütlich bis sportlich."],["walk",{"level":"easy","img":"gorge","name":"Thermalquellen-Steg","facts":"2,8 km · etwa 1 Std.","text":["Start auf dem Dorfplatz. Ein Stahlsteg führt in die Dalaschlucht, einige Meter über dem Bach. Er bringt Sie zu den heissen Quellen.","Zwei Eisentreppen führen aus der Schlucht hinaus. Eine freiwillige Spende ist willkommen (bar oder Twint)."]}],["walk",{"level":"easy","img":"hamlet","name":"Spaziergang zum Bodmenstübli","facts":"2 km · 45 Min. bis 1 Std.","text":["Leicht und sehr schön: unsere Lieblingswanderung. Der Weg beginnt hinter der Sportarena und folgt dem alten Römerweg.","Nach dem Weiler Birchen (30 Min.) erreichen Sie Bodmen. Dort wartet das Restaurant Bodmenstübli mit seiner Terrasse. Zurück auf dem gleichen Weg."]}],["walk",{"level":"hard","img":"gemmi","name":"Zu Fuss auf die Gemmi","facts":"4,6 km · 970 Höhenmeter · 2 bis 2½ Std.","text":["Für Sportliche, ohne Seilbahn. Der Weg beginnt bei der Talstation der Gemmibahn. Er wurde im 18. Jahrhundert in den Fels geschlagen und führt in Kehren bis zum Pass auf 2350 m.","Der Weg ist gesichert, aber ausgesetzt: gute Schuhe und Schwindelfreiheit. Oben lohnt sich die Runde um den Daubensee. Zurück mit der Seilbahn (10 % Rabatt mit der Guest Card)."]}]],"en":[["p","Three walks, from relaxed to sporty."],["walk",{"level":"easy","img":"gorge","name":"Thermal springs footbridge","facts":"2.8 km · about 1 hr","text":["Start from the village square. A steel footbridge enters the Dala gorge, a few metres above the stream. It leads to the hot springs.","Two metal staircases take you out of the gorge. A voluntary donation is welcome (cash or Twint)."]}],["walk",{"level":"easy","img":"hamlet","name":"Walk to the Bodmenstübli","facts":"2 km · 45 min to 1 hr","text":["Easy and lovely: our favourite walk. The path starts behind the Sportarena and follows the old Römerweg.","After the hamlet of Birchen (30 min), it reaches Bodmen. The Bodmenstübli restaurant awaits you there with its terrace. Return the same way."]}],["walk",{"level":"hard","img":"gemmi","name":"Hiking up the Gemmi","facts":"4.6 km · 970 m climb · 2 to 2½ hrs","text":["For the sporty, without the cable car. The path starts near the Gemmibahn valley station. Cut into the cliff in the 18th century, it zigzags up to the pass at 2,350 m.","The path is secured but exposed: wear good shoes and only go if you have a head for heights. At the top, walk around Lake Daubensee. Come down by cable car (10% off with the Guest Card)."]}]],"it":[["p","Tre passeggiate, dalla più tranquilla alla più sportiva."],["walk",{"level":"easy","img":"gorge","name":"Passerella delle sorgenti termali","facts":"2,8 km · circa 1 ora","text":["Partenza dalla piazza del paese. Una passerella d’acciaio entra nella gola della Dala, a pochi metri sopra il torrente. Porta alle sorgenti calde.","Due scale metalliche permettono di uscire dalla gola. È gradita un’offerta libera (contanti o Twint)."]}],["walk",{"level":"easy","img":"hamlet","name":"Passeggiata al Bodmenstübli","facts":"2 km · da 45 min a 1 ora","text":["Facile e molto piacevole: è la nostra passeggiata preferita. Il sentiero parte dietro la Sportarena e segue l’antico Römerweg.","Dopo la frazione di Birchen (30 min) arriva a Bodmen. Lì vi aspetta il ristorante Bodmenstübli con la sua terrazza. Ritorno per la stessa strada."]}],["walk",{"level":"hard","img":"gemmi","name":"Salita alla Gemmi a piedi","facts":"4,6 km · 970 m di dislivello · da 2 a 2 ore e mezza","text":["Per gli sportivi, senza funivia. Il sentiero parte vicino alla stazione a valle della Gemmibahn. Scavato nella roccia nel XVIII secolo, sale a tornanti fino al passo, a 2350 m.","Il sentiero è attrezzato ma esposto: scarpe adatte e niente vertigini. In cima, fate il giro del lago Daubensee. Scendete in funivia (10 % di sconto con la Guest Card)."]}]],"es":[["p","Tres paseos, del más tranquilo al más deportivo."],["walk",{"level":"easy","img":"gorge","name":"Pasarela de las fuentes termales","facts":"2,8 km · alrededor de 1 h","text":["Salida desde la plaza del pueblo. Una pasarela de acero entra en la garganta del Dala, a pocos metros sobre el torrente. Lleva hasta las fuentes calientes.","Dos escaleras metálicas permiten salir de la garganta. Se agradece un donativo libre (efectivo o Twint)."]}],["walk",{"level":"easy","img":"hamlet","name":"Paseo al Bodmenstübli","facts":"2 km · de 45 min a 1 h","text":["Fácil y muy agradable: es nuestro paseo favorito. El camino sale detrás de la Sportarena y sigue el antiguo Römerweg.","Tras la aldea de Birchen (30 min), llega a Bodmen. Allí le espera el restaurante Bodmenstübli con su terraza. Vuelta por el mismo camino."]}],["walk",{"level":"hard","img":"gemmi","name":"Subida a la Gemmi a pie","facts":"4,6 km · 970 m de desnivel · de 2 a 2 h 30","text":["Para deportistas, sin teleférico. El camino sale cerca de la estación del Gemmibahn. Excavado en el acantilado en el siglo XVIII, sube en zigzag hasta el puerto, a 2350 m.","El camino está asegurado pero expuesto: buen calzado y sin vértigo. Arriba, dé la vuelta al lago Daubensee. Baje en teleférico (10 % de descuento con la Guest Card)."]}]]},"food":{"fr":[["p","Nos adresses préférées."],["resto",{"id":"bodmenstuebli","name":"1. Bodmenstübli","text":"Dans le hameau de Bodmen, à 45 minutes à pied du village. Les voitures n’y montent pas. Restaurant chaleureux avec une grande terrasse et une vue dégagée sur les montagnes. Parfait au bout de la balade du Römerweg."}],["resto",{"id":"weidstuebli","tel":"+41 27 470 35 58","name":   function browserLang(){
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++){ var l = String(list[i]).slice(0,2).toLowerCase(); if (LANGS.indexOf(l) >= 0) return l; }
    return 'en';
  }
  var manualLang = null;
  try { manualLang = sessionStorage.getItem('cn-lang'); } catch(e){}
  if (LANGS.indexOf(qs.lang) >= 0) manualLang = qs.lang;

  function todo(key){ return '<div class="todo"><b>À compléter</b>' + esc(D.todo[key] || key) + '</div>'; }
  function figure(key, lang){
    var im = D.img[key]; if (!im) return '';
    var cr = im.url ? '<a href="' + esc(im.url) + '" target="_blank" rel="noopener">' + esc(im.credit) + '</a>' : esc(im.credit);
    return '<figure class="ph"><img src="' + esc(im.src) + '" width="' + im.w + '" height="' + im.h + '" alt="" loading="lazy" decoding="async"><figcaption>' + esc(T[lang].photo) + ' : ' + cr + '</figcaption></figure>';
  }
  function telLink(n){ return '<a href="tel:' + esc(String(n).replace(/[^+\d]/g,'')) + '">' + esc(n) + '</a>'; }
  function render_blocks(sec, lang, S){
    var t = T[lang], vars = {checkin: S.checkin || '15:00', checkout: S.checkout || '11:00'};
    return (D.c[sec][lang] || []).map(function(b){
      var k = b[0], v = b[1];
      if (k === 'p') return '<p>' + esc(fill(v, vars)) + '</p>';
      if (k === 'h') return '<h3>' + esc(v) + '</h3>';
      if (k === 'ul') return '<ul>' + v.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
      if (k === 'ol') return '<ol class="legend">' + v.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
      if (k === 'todo') return todo(v);
      if (k === 'img') return figure(v, lang);
      if (k === 'remote') return '<div class="remote-wrap">' + REMOTE + '</div>';
      if (k === 'map') return '<div class="map" id="map" role="region" aria-label="Map"></div><div class="map-legend"><span><i class="dot home"></i>' + esc(t.map_home) + '</span><span><i class="dot park"></i>' + esc(t.map_park) + '</span><span><i class="dash"></i>' + esc(t.map_walk) + '</span></div>';
      if (k === 'walk') return '<article class="walk">' + figure(v.img, lang) + '<div class="walk-b"><span class="lvl ' + v.level + '">' + esc(t[v.level]) + '</span><h3>' + esc(v.name) + '</h3><p class="facts">' + esc(v.facts) + '</p>' + v.text.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div></article>';
      if (k === 'resto'){
        var img = D.restoImg.indexOf(v.id) >= 0 ? '<img class="rimg" src="img/resto-' + esc(v.id) + '.jpg" alt="" loading="lazy">' : '';
        return '<article class="resto">' + img + '<div><h3>' + esc(v.name) + '</h3><p>' + esc(v.text) + '</p>' + '<p class="facts">' + (v.tel ? esc(t.tel) + ' ' + telLink(v.tel) + ' · ' : '') + '<a href="https://www.google.com/maps/search/?api=1&amp;query=' + encodeURIComponent(D.mapsQ[v.id] || v.name) + '" target="_blank" rel="noopener">' + esc(t.maps) + '</a></p></div></article>';
      }
      if (k === 'tel') return '<ul>' + v.map(function(e){ return '<li>' + esc(e[0]) + ' ' + telLink(e[1]) + '</li>'; }).join('') + '</ul>';
      if (k === 'contact'){
        if (S.hostPhone) return '<p>' + esc(fill(v[0],{phone:'\u0000'})).replace('\u0000', telLink(S.hostPhone)) + '</p>';
        return '<p>' + esc(v[1]) + '</p>';
      }
      if (k === 'thanks') return '<p>' + esc(t.thanks) + '</p>';
      return '';
    }).join('');
  }

  var FLOURISH = "<svg class=\"flourish\" viewBox=\"0 0 320 44\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n<path stroke-width=\"1.3\" d=\"M8 30c22-1 38-6 58-6 18 0 26 7 42 7 12 0 18-4 24-8\"/>\n<path stroke-width=\"1.3\" d=\"M312 30c-22-1-38-6-58-6-18 0-26 7-42 7-12 0-18-4-24-8\"/>\n<path stroke-width=\"1.5\" d=\"M141 33c6-5 13-5 19 0s13 5 19 0\"/>\n<path stroke-width=\"1.3\" d=\"M151 24c-5-4 4-7 0-12M160 23c-5-4 5-8 0-14M169 24c-5-4 4-7 0-12\"/>\n<circle cx=\"66\" cy=\"24\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"/><circle cx=\"254\" cy=\"24\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"/>\n</svg>";
  function render(){
    var S = state.settings || {};
    var stay = currentStay(state.stays);
    var names = qs.nom ? namesOf({name: qs.nom}) : (stay ? namesOf(stay) : []);
    var lang = manualLang || (stay && LANGS.indexOf(stay.lang) >= 0 ? stay.lang : browserLang());
    var t = T[lang];
    document.documentElement.lang = lang;
    var shown = joinNames(names, lang);
    var w = names.length ? ((names.length > 1 && t.welcomeNamedPlural) ? t.welcomeNamedPlural : t.welcomeNamed) : t.welcomeAnon;
    var h = '<div class="wrap">';
    h += '<header class="top"><div class="brand">Cosy Nest</div><div class="langs" role="group" aria-label="Language">' +
         LANGS.map(function(l){ return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === lang) + '" lang="' + l + '">' + T[l].name + '</button>'; }).join('') + '</div></header>';
    h += '<section class="hero"><h1>';
    if (loading && !names.length) h += esc(t.welcomeAnon[0]) + '<br><span class="skel"></span>';
    else h += esc(fill(w[0],{name:shown})) + '<br>' + esc(fill(w[1],{name:shown}));
    h += '</h1><p class="intro">' + esc(t.intro) + '</p><p class="place">' + esc(t.place) + '</p>';
    if (stay && !qs.nom){
      var y = todayISO().slice(0,4), sameYear = stay.from.slice(0,4) === y && stay.to.slice(0,4) === y;
      h += '<p class="stay">' + esc(fill(t.stay,{from:fmtDate(stay.from,lang,!sameYear), to:fmtDate(stay.to,lang,!sameYear)})) + '</p>';
    }
    h += FLOURISH + '</section>';
    h += '<section class="card"><h2>Wi\u2011Fi</h2>';
    if (S.wifiName || S.wifiPass){
      if (S.wifiName) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v" id="wifiName">' + esc(S.wifiName) + '</span></div><button type="button" class="copy" data-copy="wifiName">' + esc(t.copy) + '</button></div>';
      if (S.wifiPass) h += '<div class="kv' + (S.wifiName ? '' : ' first') + '"><div><span class="k">' + esc(t.password) + '</span><span class="v" id="wifiPass">' + esc(S.wifiPass) + '</span></div><button type="button" class="copy" data-copy="wifiPass">' + esc(t.copy) + '</button></div>';
    } else if (loading) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v"><span class="skel"></span></span></div></div>';
    else h += todo('wifi');
    h += '</section><div class="topics">' + D.order.map(function(id){
      return '<details class="topic" data-id="' + id + '"><summary>' + esc(t.titles[id]) + '</summary><div class="body">' + render_blocks(id, lang, S) + '</div></details>';
    }).join('') + '</div>';
    h += '<footer class="bottom">Cosy Nest<br>Zur Gasse 87, 3954 Leukerbad</footer></div>';
    var app = document.getElementById('app');
    var open = {}; app.querySelectorAll('details.topic[open]').forEach(function(d){ open[d.dataset.id] = true; });
    if (map) { try { map.remove(); } catch(e){} map = null; }
    app.innerHTML = h;
    app.querySelectorAll('details.topic').forEach(function(d){
      if (open[d.dataset.id]) d.open = true;
      d.addEventListener('toggle', function(){ if (d.open && d.dataset.id === 'parking') initMap(lang); });
    });
    if (open.parking) initMap(lang);
    wire(lang);
  }

  var map = null;
  function initMap(lang){
    var el = document.getElementById('map');
    if (!el || map || !window.L) return;
    var t = T[lang];
    map = L.map(el, {scrollWheelZoom:false, attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
    var line = L.polyline(D.map.route, {color:'#2F6F79', weight:4, dashArray:'2 8', lineCap:'round'}).addTo(map);
    function pin(cls, label){ return L.divIcon({className:'', html:'<span class="pin ' + cls + '">' + label + '</span>', iconSize:[30,30], iconAnchor:[15,15]}); }
    L.marker(D.map.home, {icon: pin('home', '\u2302')}).addTo(map).bindPopup(esc(t.map_home));
    L.marker(D.map.park, {icon: pin('park', 'P')}).addTo(map).bindPopup(esc(t.map_park) + '<br>Römerweg 5');
    map.fitBounds(line.getBounds(), {padding:[40,40], maxZoom:17});
  }

  function wire(lang){
    var app = document.getElementById('app');
    app.querySelectorAll('.langs button').forEach(function(b){
      b.addEventListener('click', function(){ manualLang = b.dataset.lang; try { sessionStorage.setItem('cn-lang', manualLang); } catch(e){} render(); });
    });
    app.querySelectorAll('.copy').forEach(function(b){
      b.addEventListener('click', function(){
        var v = document.getElementById(b.dataset.copy).textContent;
        var done = function(){ var old = b.textContent; b.textContent = T[lang].copied; setTimeout(function(){ b.textContent = old; }, 1600); };
        try { navigator.clipboard.writeText(v).then(done, function(){}); } catch(e){}
      });
    });
  }

  render();
  var settled = false;
  function settle(){ if (settled) return; settled = true; loading = false; render(); }
  setTimeout(settle, 6000);
  api('GET').then(function(data){
    if (data && Array.isArray(data.stays)){
      state = {stays: data.stays, settings: data.settings || {}};
      try { localStorage.setItem('cn-state', JSON.stringify(state)); } catch(e){}
    }
    settle();
  }, function(){ settle(); });
})();
</script>
</body>
</html>
