{"fr":[["p","Devant l’immeuble, une place permet de charger et décharger vos affaires. Durée maximale : 45 minutes."],["p","Pour stationner plus longtemps : parking de la Sportarena (Römerweg 5). Tarif : CHF 14.– par jour. Il est à environ 330 m, soit 5 minutes à pied."],["map",null]],"de":[["p","Vor dem Haus gibt es einen Platz zum Ein- und Ausladen. Höchstdauer: 45 Minuten."],["p","Für längeres Parkieren: Parkhaus Sportarena (Römerweg 5). Preis: CHF 14.– pro Tag. Es liegt rund 330 m entfernt, etwa 5 Minuten zu Fuss."],["map",null]],"en":[["p","In front of the building there is a space for loading and unloading. Maximum stay: 45 minutes."],["p","For longer parking: Sportarena car park (Römerweg 5). Price: CHF 14 per day. It is about 330 m away, a 5-minute walk."],["map",null]],"it":[["p","Davanti all’edificio c’è un posto per caricare e scaricare i bagagli. Durata massima: 45 minuti."],["p","Per sostare più a lungo: parcheggio della Sportarena (Römerweg 5). Tariffa: CHF 14.– al giorno. Si trova a circa 330 m, 5 minuti a piedi."],["map",null]],"es":[["p","Delante del edificio hay una plaza para cargar y descargar. Tiempo máximo: 45 minutos."],["p","Para aparcar más tiempo: aparcamiento de la Sportarena (Römerweg 5). Precio: CHF 14 al día. Está a unos 330 m, 5 minutos a pie."],["map",null]]},"tv":{"fr":[["p","La télévision est une Samsung The Frame de 65 pouces. Éteinte, elle affiche une œuvre d’art : c’est le mode Art."],["h","Télécommande Samsung (télévision)"],["remote",null],["ol",["Marche/arrêt. Appui court : passer du mode Art à la télévision. Appui long : éteindre complètement.","Home : ouvre le menu de la télévision (Netflix, sources).","Pavé directionnel : se déplacer. Appuyer au centre pour valider.","Retour : revenir à l’écran précédent.","Volume : pousser vers le haut ou le bas. Appuyer pour couper le son.","Chaînes : pour les chaînes, utilisez plutôt la télécommande Sunrise.","Netflix : ouvre Netflix directement."]],["h","Regarder les chaînes (boîtier Sunrise)"],["p","Les chaînes passent par le boîtier Sunrise, avec sa propre télécommande."],["p","Allumez la télévision avec la télécommande Samsung. Changez ensuite de chaîne avec la télécommande Sunrise."],["p","Pas d’image Sunrise ? Appuyez sur Home (2) de la télécommande Samsung et choisissez l’entrée HDMI du boîtier."],["h","Télécommande Sunrise (boîtier)"],["remote2",null],["ol",["TV : allume ou éteint la télévision.","Marche/arrêt du boîtier Sunrise.","Home : ouvre le menu Sunrise.","TV : revient à la télévision en direct.","Pavé directionnel : se déplacer. Appuyer sur OK pour valider.","Retour : revenir à l’écran précédent.","Volume : plus fort ou moins fort.","Chaînes : chaîne suivante ou précédente.","Chiffres : taper directement le numéro d’une chaîne.","Source : changer l’entrée de la télévision."]],["h","Netflix"],["p","Appuyez sur le bouton Netflix (7). Notre compte est déjà connecté. Merci de ne pas vous déconnecter."],["p","La télécommande ne répond plus ? Rechargez-la avec le câble USB‑C ou posez-la à la lumière, face solaire vers le haut."]],"de":[["p","Der Fernseher ist ein Samsung The Frame mit 65 Zoll. Im ausgeschalteten Zustand zeigt er ein Kunstwerk: das ist der Art-Modus."],["h","Samsung-Fernbedienung (Fernseher)"],["remote",null],["ol",["Ein/Aus. Kurz drücken: vom Art-Modus zum Fernsehen wechseln. Lange drücken: ganz ausschalten.","Home: öffnet das Menü des Fernsehers (Netflix, Quellen).","Steuerkreuz: navigieren. In der Mitte drücken zum Bestätigen.","Zurück: zum vorherigen Bildschirm.","Lautstärke: nach oben oder unten drücken. Drücken für Stummschaltung.","Sender: für die Sender besser die Sunrise-Fernbedienung benutzen.","Netflix: öffnet Netflix direkt."]],["h","Fernsehsender (Sunrise-Box)"],["p","Die Sender laufen über die Sunrise-Box mit eigener Fernbedienung."],["p","Schalten Sie den Fernseher mit der Samsung-Fernbedienung ein. Wechseln Sie dann die Sender mit der Sunrise-Fernbedienung."],["p","Kein Sunrise-Bild? Drücken Sie Home (2) auf der Samsung-Fernbedienung und wählen Sie den HDMI-Eingang der Box."],["h","Sunrise-Fernbedienung (Box)"],["remote2",null],["ol",["TV: schaltet den Fernseher ein oder aus.","Ein/Aus der Sunrise-Box.","Home: öffnet das Sunrise-Menü.","TV: zurück zum Live-Fernsehen.","Steuerkreuz: navigieren. Mit OK bestätigen.","Zurück: zum vorherigen Bildschirm.","Lautstärke: lauter oder leiser.","Sender: nächster oder vorheriger Sender.","Zahlen: Sendernummer direkt eingeben.","Quelle: Eingang des Fernsehers wechseln."]],["h","Netflix"],["p","Drücken Sie die Netflix-Taste (7). Unser Konto ist bereits angemeldet. Bitte melden Sie sich nicht ab."],["p","Die Fernbedienung reagiert nicht? Laden Sie sie mit dem USB‑C-Kabel oder legen Sie sie mit der Solarseite nach oben ans Licht."]],"en":[["p","The TV is a 65-inch Samsung The Frame. When it is off, it shows a work of art: this is Art Mode."],["h","Samsung remote (TV)"],["remote",null],["ol",["Power. Short press: switch from Art Mode to TV. Long press: switch off completely.","Home: opens the TV menu (Netflix, sources).","Direction pad: move around. Press the centre to select.","Back: return to the previous screen.","Volume: push up or down. Press to mute.","Channels: for TV channels, use the Sunrise remote instead.","Netflix: opens Netflix directly."]],["h","Watching TV channels (Sunrise box)"],["p","TV channels come through the Sunrise box, which has its own remote."],["p","Turn on the TV with the Samsung remote. Then change channels with the Sunrise remote."],["p","No Sunrise picture? Press Home (2) on the Samsung remote and select the box’s HDMI input."],["h","Sunrise remote (box)"],["remote2",null],["ol",["TV: turns the television on or off.","Power for the Sunrise box.","Home: opens the Sunrise menu.","TV: back to live TV.","Direction pad: move around. Press OK to select.","Back: return to the previous screen.","Volume: louder or quieter.","Channels: next or previous channel.","Numbers: type a channel number directly.","Source: change the TV input."]],["h","Netflix"],["p","Press the Netflix button (7). Our account is already signed in. Please do not sign out."],["p","Remote not responding? Charge it with the USB‑C cable or place it in the light, solar side up."]],"it":[["p","La televisione è una Samsung The Frame da 65 pollici. Da spenta mostra un’opera d’arte: è la modalità Art."],["h","Telecomando Samsung (televisore)"],["remote",null],["ol",["Accensione. Pressione breve: passare dalla modalità Art alla TV. Pressione lunga: spegnere del tutto.","Home: apre il menu del televisore (Netflix, sorgenti).","Tasti direzionali: spostarsi. Premere al centro per confermare.","Indietro: tornare alla schermata precedente.","Volume: spingere in su o in giù. Premere per togliere l’audio.","Canali: per i canali usate piuttosto il telecomando Sunrise.","Netflix: apre direttamente Netflix."]],["h","Guardare i canali (box Sunrise)"],["p","I canali passano dal box Sunrise, che ha il suo telecomando."],["p","Accendete la televisione con il telecomando Samsung. Poi cambiate canale con il telecomando Sunrise."],["p","Nessuna immagine Sunrise? Premete Home (2) sul telecomando Samsung e scegliete l’ingresso HDMI del box."],["h","Telecomando Sunrise (box)"],["remote2",null],["ol",["TV: accende o spegne il televisore.","Accensione del box Sunrise.","Home: apre il menu Sunrise.","TV: torna alla TV in diretta.","Tasti direzionali: spostarsi. Premere OK per confermare.","Indietro: tornare alla schermata precedente.","Volume: più alto o più basso.","Canali: canale successivo o precedente.","Numeri: digitare direttamente il numero di un canale.","Sorgente: cambiare l’ingresso del televisore."]],["h","Netflix"],["p","Premete il tasto Netflix (7). Il nostro account è già collegato. Vi preghiamo di non disconnettervi."],["p","Il telecomando non risponde? Ricaricatelo con il cavo USB‑C o mettetelo alla luce, con il lato solare verso l’alto."]],"es":[["p","La televisión es una Samsung The Frame de 65 pulgadas. Apagada, muestra una obra de arte: es el modo Arte."],["h","Mando Samsung (televisor)"],["remote",null],["ol",["Encendido. Pulsación corta: pasar del modo Arte a la televisión. Pulsación larga: apagar del todo.","Home: abre el menú del televisor (Netflix, fuentes).","Cruceta: moverse. Pulse el centro para confirmar.","Atrás: volver a la pantalla anterior.","Volumen: empujar hacia arriba o abajo. Pulsar para silenciar.","Canales: para los canales, use mejor el mando Sunrise.","Netflix: abre Netflix directamente."]],["h","Ver los canales (decodificador Sunrise)"],["p","Los canales pasan por el decodificador Sunrise, que tiene su propio mando."],["p","Encienda la televisión con el mando Samsung. Después cambie de canal con el mando Sunrise."],["p","¿No hay imagen Sunrise? Pulse Home (2) en el mando Samsung y elija la entrada HDMI del decodificador."],["h","Mando Sunrise (decodificador)"],["remote2",null],["ol",["TV: enciende o apaga el televisor.","Encendido del decodificador Sunrise.","Home: abre el menú Sunrise.","TV: vuelve a la TV en directo.","Cruceta: moverse. Pulse OK para confirmar.","Atrás: volver a la pantalla anterior.","Volumen: más alto o más bajo.","Canales: canal siguiente o anterior.","Números: marcar directamente el número de un canal.","Fuente: cambiar la entrada del televisor."]],["h","Netflix"],["p","Pulse el botón Netflix (7). Nuestra cuenta ya está conectada. Por favor, no cierre la sesión."],["p","¿El mando no responde? Cárguelo con el cable USB‑C o déjelo a la luz, con la cara solar hacia arriba."]]},"table":{"fr":[["p","Pour partager un repas à quatre, installez les deux tabourets en bois autour de la table, en complément des deux chaises. Bon appétit !"],["img","ph_table"]],"de":[["p","Für ein Essen zu viert stellen Sie die zwei Holzhocker zusätzlich zu den zwei Stühlen an den Tisch. En Guete!"],["img","ph_table"]],"en":[["p","To share a meal for four, place the two wooden stools around the table next to the two chairs. Enjoy your meal!"],["img","ph_table"]],"it":[["p","Per un pasto in quattro, sistemate i due sgabelli di legno intorno al tavolo, oltre alle due sedie. Buon appetito!"],["img","ph_table"]],"es":[["p","Para comer cuatro, coloque los dos taburetes de madera alrededor de la mesa, junto a las dos sillas. ¡Buen provecho!"],["img","ph_table"]]},"coffee":{"fr":[["p","Pour commencer la journée en douceur ou vous réchauffer au retour d’une balade, du café fraîchement moulu par la machine, ainsi que du thé et des infusions, sont à votre disposition dans la cuisine."],["img","ph_coffee"],["p","Servez-vous et savourez ce petit moment de détente !"]],"de":[["p","Um sanft in den Tag zu starten oder sich nach einem Spaziergang aufzuwärmen, stehen Ihnen in der Küche frisch gemahlener Kaffee aus der Maschine sowie Tee und Kräutertee zur Verfügung."],["img","ph_coffee"],["p","Bedienen Sie sich und geniessen Sie diesen kleinen Moment der Entspannung!"]],"en":[["p","To start the day gently or warm up after a walk, coffee freshly ground by the machine, as well as tea and herbal teas, are available in the kitchen."],["img","ph_coffee"],["p","Help yourself and enjoy this little moment of relaxation!"]],"it":[["p","Per iniziare la giornata con calma o riscaldarvi dopo una passeggiata, in cucina trovate caffè macinato al momento dalla macchina, tè e tisane."],["img","ph_coffee"],["p","Servitevi e gustatevi questo piccolo momento di relax!"]],"es":[["p","Para empezar el día con calma o entrar en calor tras un paseo, en la cocina tiene a su disposición café recién molido por la máquina, además de té e infusiones."],["img","ph_coffee"],["p","¡Sírvase y disfrute de este pequeño momento de descanso!"]]},"games":{"fr":[["p","Des jeux de société vous attendent dans le meuble sous la télévision : de quoi partager un moment convivial en famille ou entre amis après une journée à la montagne."],["img","ph_games"]],"de":[["p","Im Möbel unter dem Fernseher finden Sie Gesellschaftsspiele: ideal für einen geselligen Abend mit Familie oder Freunden nach einem Tag in den Bergen."],["img","ph_games"]],"en":[["p","Board games are waiting in the cabinet under the TV: perfect for a fun evening with family or friends after a day in the mountains."],["img","ph_games"]],"it":[["p","Nel mobile sotto la televisione trovate dei giochi da tavolo: perfetti per un momento in compagnia con la famiglia o gli amici dopo una giornata in montagna."],["img","ph_games"]],"es":[["p","En el mueble bajo el televisor le esperan juegos de mesa: perfectos para compartir un buen rato en familia o con amigos después de un día en la montaña."],["img","ph_games"]]},"trash":{"fr":[["p","Sortez de l’immeuble et traversez la place. Le local à ordures est en face : une porte en bois arrondie, sous le panneau « Kunibergstrasse »."],["img","trash"],["p","Seuls les sacs taxés officiels sont acceptés. Le verre et le carton ne vont pas dans ce local."],["p","Les sacs taxés s’achètent à la caisse de la Migros ou de la Coop : demandez un sachet ou un rouleau."]],"de":[["p","Verlassen Sie das Haus und überqueren Sie den Platz. Der Abfallraum ist gegenüber: eine runde Holztür unter dem Schild «Kunibergstrasse»."],["img","trash"],["p","Nur offizielle Gebührensäcke sind erlaubt. Glas und Karton gehören nicht in diesen Raum."],["p","Die Gebührensäcke erhalten Sie an der Kasse der Migros oder des Coop. Fragen Sie nach einer Packung oder einer Rolle."]],"en":[["p","Leave the building and cross the square. The rubbish room is opposite: a rounded wooden door under the “Kunibergstrasse” sign."],["img","trash"],["p","Only official taxed bags are accepted. Glass and cardboard do not go in this room."],["p","You can buy the taxed bags at the checkout in Migros or Coop. Ask for a pack or a roll."]],"it":[["p","Uscite dall’edificio e attraversate la piazza. Il locale rifiuti è di fronte: una porta di legno ad arco, sotto il cartello «Kunibergstrasse»."],["img","trash"],["p","Sono accettati solo i sacchi ufficiali a pagamento. Vetro e cartone non vanno in questo locale."],["p","I sacchi a pagamento si comprano alla cassa della Migros o della Coop. Chiedete una confezione o un rotolo."]],"es":[["p","Salga del edificio y cruce la plaza. El cuarto de basuras está enfrente: una puerta de madera en arco, bajo el cartel «Kunibergstrasse»."],["img","trash"],["p","Solo se aceptan las bolsas oficiales de pago. El vidrio y el cartón no van en este cuarto."],["p","Las bolsas de pago se compran en la caja de Migros o Coop. Pida un paquete o un rollo."]]},"microwave":{"fr":[["p","Un micro-ondes se trouve dans le placard au-dessus du réfrigérateur. Il suffit de relever la porte du meuble pour y accéder."],["img","ph_microwave"]],"de":[["p","Eine Mikrowelle befindet sich im Schrank über dem Kühlschrank. Klappen Sie einfach die Schranktür nach oben."],["img","ph_microwave"]],"en":[["p","A microwave is in the cupboard above the fridge. Just lift the cupboard door to reach it."],["img","ph_microwave"]],"it":[["p","Il microonde si trova nel pensile sopra il frigorifero. Basta sollevare l’anta del mobile per raggiungerlo."],["img","ph_microwave"]],"es":[["p","Hay un microondas en el armario encima de la nevera. Basta con levantar la puerta del mueble para acceder."],["img","ph_microwave"]]},"balcony":{"fr":[["p","Les coussins des fauteuils vous attendent dans le coffre du balcon. Installez-vous confortablement et profitez de votre pause au grand air !"],["img","ph_balcony"],["p","Après utilisation, merci de les ranger dans le coffre et de bien refermer le couvercle pour les protéger des intempéries."]],"de":[["p","Die Kissen für die Sessel liegen in der Truhe auf dem Balkon. Machen Sie es sich gemütlich und geniessen Sie die frische Luft!"],["img","ph_balcony"],["p","Bitte legen Sie sie nach dem Gebrauch zurück in die Truhe und schliessen Sie den Deckel gut, um sie vor dem Wetter zu schützen."]],"en":[["p","The armchair cushions are waiting for you in the chest on the balcony. Make yourself comfortable and enjoy the fresh air!"],["img","ph_balcony"],["p","After use, please put them back in the chest and close the lid firmly to protect them from the weather."]],"it":[["p","I cuscini delle poltrone vi aspettano nel baule del balcone. Mettetevi comodi e godetevi una pausa all’aria aperta!"],["img","ph_balcony"],["p","Dopo l’uso, riponeteli nel baule e chiudete bene il coperchio per proteggerli dalle intemperie."]],"es":[["p","Los cojines de los sillones le esperan en el arcón del balcón. ¡Póngase cómodo y disfrute de un descanso al aire libre!"],["img","ph_balcony"],["p","Después de usarlos, guárdelos en el arcón y cierre bien la tapa para protegerlos de la intemperie."]]},"laundry":{"fr":[["p","Une machine à laver est à votre disposition au sous-sol, un étage plus bas. Pour réserver votre créneau, inscrivez-vous sur le planning affiché sur la porte de la buanderie."],["img","ph_laundry"],["p","Un étendoir se trouve sur le balcon du studio."]],"de":[["p","Im Untergeschoss, ein Stockwerk tiefer, steht Ihnen eine Waschmaschine zur Verfügung. Tragen Sie sich für Ihren Zeitraum in den Plan an der Tür der Waschküche ein."],["img","ph_laundry"],["p","Ein Wäscheständer steht auf dem Balkon des Studios."]],"en":[["p","A washing machine is available in the basement, one floor down. To book a time slot, sign up on the schedule posted on the laundry room door."],["img","ph_laundry"],["p","A clothes airer is on the studio balcony."]],"it":[["p","Nel seminterrato, un piano più in basso, avete a disposizione una lavatrice. Per prenotare la vostra fascia oraria, segnatevi sul calendario appeso alla porta della lavanderia."],["img","ph_laundry"],["p","Uno stendibiancheria si trova sul balcone dello studio."]],"es":[["p","En el sótano, un piso más abajo, tiene a su disposición una lavadora. Para reservar su turno, apúntese en la hoja colgada en la puerta de la lavandería."],["img","ph_laundry"],["p","En el balcón del estudio hay un tendedero."]]},"guestcard":{"fr":[["p","La Leukerbad Guest Card est incluse dans la taxe de séjour. Elle vous donne ces avantages :"],["ul",["15 % de réduction sur l’entrée aux trois centres thermaux : Leukerbad Therme, Walliser Alpentherme & SPA et Therme 51°.","10 % de réduction sur les remontées mécaniques.","Transports gratuits avec le bus local Ringjet et les lignes Leukerbad–Flaschen–Albinen et Leukerbad–Inden, y compris Rumeling et Tschingeren.","Accès gratuit au Snowpark Sportarena.","Accès gratuit aux installations sportives de la Sportarena Leukerbad (tennis, badminton, patinoire). 50 % de réduction sur le padel. La location de matériel reste payante.","Accès gratuit au court de tennis en terre battue de l’hôtel Regina Terme, de juin à octobre.","Participation gratuite à une sélection de concerts, animations et excursions de la Leukerbad Guest Card."]],["p","Vous recevez la Guest Card par e-mail."]],"de":[["p","Die Leukerbad Guest Card ist in der Kurtaxe inbegriffen. Sie bietet Ihnen diese Vorteile:"],["ul",["15 % Rabatt auf den Eintritt in die drei Thermalbäder: Leukerbad Therme, Walliser Alpentherme & SPA und Therme 51°.","10 % Rabatt auf die Bergbahnen.","Gratis Busfahrten mit dem Ortsbus Ringjet und den Linien Leukerbad–Flaschen–Albinen und Leukerbad–Inden, inklusive Rumeling und Tschingeren.","Gratis Zugang zum Snowpark Sportarena.","Gratis Zugang zu den Sportanlagen der Sportarena Leukerbad (Tennis, Badminton, Eisbahn). 50 % Rabatt auf Padel. Die Materialmiete ist kostenpflichtig.","Gratis Zugang zum Sandplatz-Tennis des Hotels Regina Terme, von Juni bis Oktober.","Gratis Teilnahme an ausgewählten Konzerten, Animationen und Ausflügen der Leukerbad Guest Card."]],["p","Sie erhalten die Guest Card per E-Mail."]],"en":[["p","The Leukerbad Guest Card is included in the tourist tax. It gives you these benefits:"],["ul",["15% off admission to the three thermal baths: Leukerbad Therme, Walliser Alpentherme & SPA and Therme 51°.","10% off the cable cars and ski lifts.","Free travel on the local Ringjet bus and on the Leukerbad–Flaschen–Albinen and Leukerbad–Inden lines, including Rumeling and Tschingeren.","Free access to the Snowpark Sportarena.","Free access to the Sportarena Leukerbad facilities (tennis, badminton, ice rink). 50% off padel. Equipment hire is not included.","Free access to the clay tennis court of Hotel Regina Terme, from June to October.","Free entry to a selection of concerts, events and excursions of the Leukerbad Guest Card."]],["p","You receive the Guest Card by email."]],"it":[["p","La Leukerbad Guest Card è inclusa nella tassa di soggiorno. Vi offre questi vantaggi:"],["ul",["15 % di sconto sull’ingresso ai tre centri termali: Leukerbad Therme, Walliser Alpentherme & SPA e Therme 51°.","10 % di sconto sugli impianti di risalita.","Trasporti gratuiti con il bus locale Ringjet e con le linee Leukerbad–Flaschen–Albinen e Leukerbad–Inden, compresi Rumeling e Tschingeren.","Accesso gratuito allo Snowpark Sportarena.","Accesso gratuito agli impianti sportivi della Sportarena Leukerbad (tennis, badminton, pista di pattinaggio). 50 % di sconto sul padel. Il noleggio dell’attrezzatura è a pagamento.","Accesso gratuito al campo da tennis in terra battuta dell’hotel Regina Terme, da giugno a ottobre.","Partecipazione gratuita a una selezione di concerti, animazioni ed escursioni della Leukerbad Guest Card."]],["p","Ricevete la Guest Card per e-mail."]],"es":[["p","La Leukerbad Guest Card está incluida en la tasa turística. Le ofrece estas ventajas:"],["ul",["15 % de descuento en la entrada a los tres centros termales: Leukerbad Therme, Walliser Alpentherme & SPA y Therme 51°.","10 % de descuento en los remontes.","Transporte gratuito en el autobús local Ringjet y en las líneas Leukerbad–Flaschen–Albinen y Leukerbad–Inden, incluidos Rumeling y Tschingeren.","Acceso gratuito al Snowpark Sportarena.","Acceso gratuito a las instalaciones de la Sportarena Leukerbad (tenis, bádminton, pista de hielo). 50 % de descuento en pádel. El alquiler de material se paga aparte.","Acceso gratuito a la pista de tenis de tierra batida del hotel Regina Terme, de junio a octubre.","Participación gratuita en una selección de conciertos, animaciones y excursiones de la Leukerbad Guest Card."]],["p","Recibe la Guest Card por correo electrónico."]]},"walks":{"fr":[["p","Trois balades, de la plus tranquille à la plus sportive."],["walk",{"level":"easy","img":"hamlet","name":"Balade au Bodmenstübli","facts":"2 km · 45 min à 1 h","text":["Facile et très agréable : c’est notre balade préférée. Le chemin part derrière la Sportarena et suit l’ancien Römerweg.","Après le hameau de Birchen (30 min), il arrive à Bodmen. Le restaurant Bodmenstübli vous y attend avec sa terrasse. Retour par le même chemin."]}],["walk",{"level":"medium","img":"gorge","name":"Sentier des sources thermales","facts":"2,8 km · environ 1 h","text":["Départ de la place du village. Une passerelle en acier entre dans la gorge de la Dala, à quelques mètres au-dessus du torrent. Elle mène aux sources chaudes.","Deux escaliers métalliques permettent de sortir de la gorge. Un don libre est demandé (espèces ou Twint).","Il ne faut pas avoir le vertige."]}],["walk",{"level":"hard","img":"gemmi","name":"Montée de la Gemmi à pied","facts":"4,6 km · 970 m de montée · 2 h à 2 h 30","text":["Pour les sportifs, sans téléphérique. Le chemin part près de la station de la Gemmibahn. Taillé dans la falaise au XVIIIe siècle, il monte en lacets jusqu’au col, à 2350 m.","Le chemin est sécurisé mais exposé : bonnes chaussures et pas de vertige. En haut, faites le tour du lac Daubensee. Redescendez en téléphérique (10 % de réduction avec la Guest Card)."]}]],"de":[["p","Drei Wanderungen, von gemütlich bis sportlich."],["walk",{"level":"easy","img":"hamlet","name":"Spaziergang zum Bodmenstübli","facts":"2 km · 45 Min. bis 1 Std.","text":["Leicht und sehr schön: unsere Lieblingswanderung. Der Weg beginnt hinter der Sportarena und folgt dem alten Römerweg.","Nach dem Weiler Birchen (30 Min.) erreichen Sie Bodmen. Dort wartet das Restaurant Bodmenstübli mit seiner Terrasse. Zurück auf dem gleichen Weg."]}],["walk",{"level":"medium","img":"gorge","name":"Thermalquellen-Steg","facts":"2,8 km · etwa 1 Std.","text":["Start auf dem Dorfplatz. Ein Stahlsteg führt in die Dalaschlucht, einige Meter über dem Bach. Er bringt Sie zu den heissen Quellen.","Zwei Eisentreppen führen aus der Schlucht hinaus. Eine freiwillige Spende ist willkommen (bar oder Twint).","Schwindelfreiheit ist nötig."]}],["walk",{"level":"hard","img":"gemmi","name":"Zu Fuss auf die Gemmi","facts":"4,6 km · 970 Höhenmeter · 2 bis 2½ Std.","text":["Für Sportliche, ohne Seilbahn. Der Weg beginnt bei der Talstation der Gemmibahn. Er wurde im 18. Jahrhundert in den Fels geschlagen und führt in Kehren bis zum Pass auf 2350 m.","Der Weg ist gesichert, aber ausgesetzt: gute Schuhe und Schwindelfreiheit. Oben lohnt sich die Runde um den Daubensee. Zurück mit der Seilbahn (10 % Rabatt mit der Guest Card)."]}]],"en":[["p","Three walks, from relaxed to sporty."],["walk",{"level":"easy","img":"hamlet","name":"Walk to the Bodmenstübli","facts":"2 km · 45 min to 1 hr","text":["Easy and lovely: our favourite walk. The path starts behind the Sportarena and follows the old Römerweg.","After the hamlet of Birchen (30 min), it reaches Bodmen. The Bodmenstübli restaurant awaits you there with its terrace. Return the same way."]}],["walk",{"level":"medium","img":"gorge","name":"Thermal springs footbridge","facts":"2.8 km · about 1 hr","text":["Start from the village square. A steel footbridge enters the Dala gorge, a few metres above the stream. It leads to the hot springs.","Two metal staircases take you out of the gorge. A voluntary donation is welcome (cash or Twint).","You need a head for heights."]}],["walk",{"level":"hard","img":"gemmi","name":"Hiking up the Gemmi","facts":"4.6 km · 970 m climb · 2 to 2½ hrs","text":["For the sporty, without the cable car. The path starts near the Gemmibahn valley station. Cut into the cliff in the 18th century, it zigzags up to the pass at 2,350 m.","The path is secured but exposed: wear good shoes and only go if you have a head for heights. At the top, walk around Lake Daubensee. Come down by cable car (10% off with the Guest Card)."]}]],"it":[["p","Tre passeggiate, dalla più tranquilla alla più sportiva."],["walk",{"level":"easy","img":"hamlet","name":"Passeggiata al Bodmenstübli","facts":"2 km · da 45 min a 1 ora","text":["Facile e molto piacevole: è la nostra passeggiata preferita. Il sentiero parte dietro la Sportarena e segue l’antico Römerweg.","Dopo la frazione di Birchen (30 min) arriva a Bodmen. Lì vi aspetta il ristorante Bodmenstübli con la sua terrazza. Ritorno per la stessa strada."]}],["walk",{"level":"medium","img":"gorge","name":"Passerella delle sorgenti termali","facts":"2,8 km · circa 1 ora","text":["Partenza dalla piazza del paese. Una passerella d’acciaio entra nella gola della Dala, a pochi metri sopra il torrente. Porta alle sorgenti calde.","Due scale metalliche permettono di uscire dalla gola. È gradita un’offerta libera (contanti o Twint).","Non bisogna soffrire di vertigini."]}],["walk",{"level":"hard","img":"gemmi","name":"Salita alla Gemmi a piedi","facts":"4,6 km · 970 m di dislivello · da 2 a 2 ore e mezza","text":["Per gli sportivi, senza funivia. Il sentiero parte vicino alla stazione a valle della Gemmibahn. Scavato nella roccia nel XVIII secolo, sale a tornanti fino al passo, a 2350 m.","Il sentiero è attrezzato ma esposto: scarpe adatte e niente vertigini. In cima, fate il giro del lago Daubensee. Scendete in funivia (10 % di sconto con la Guest Card)."]}]],"es":[["p","Tres paseos, del más tranquilo al más deportivo."],["walk",{"level":"easy","img":"hamlet","name":"Paseo al Bodmenstübli","facts":"2 km · de 45 min a 1 h","text":["Fácil y muy agradable: es nuestro paseo favorito. El camino sale detrás de la Sportarena y sigue el antiguo Römerweg.","Tras la aldea de Birchen (30 min), llega a Bodmen. Allí le espera el restaurante Bodmenstübli con       if (k === 'tel') return '<ul>' + v.map(function(e){ return '<li>' + esc(e[0]) + ' ' + telLink(e[1]) + '</li>'; }).join('') + '</ul>';
      if (k === 'contact'){
        var ph = S.hostPhone || D.hostPhone;
        if (ph) return '<p>' + esc(fill(v[0],{phone:'\u0000'})).replace('\u0000', telLink(ph)) + '</p>';
        return '<p>' + esc(v[1]) + '</p>';
      }
      if (k === 'thanks') return '<p>' + esc(t.thanks) + '</p>';
      return '';
    }).join('');
  }

  var FLOURISH = "<img class=\"hero-art\" src=\"illustration.png\" alt=\"\" width=\"1543\" height=\"784\">";
  function render(){
    var S = state.settings || {};
    var stay = currentStay(state.stays);
    var names = qs.nom ? namesOf({name: qs.nom}) : (stay ? namesOf(stay) : []);
    var lang = manualLang || (stay && LANGS.indexOf(stay.lang) >= 0 ? stay.lang : browserLang());
    var t = T[lang];
    document.documentElement.lang = lang;
    var shown = joinNames(names, lang);
    var w = names.length ? ((names.length > 1 && t.welcomeNamedPlural) ? t.welcomeNamedPlural : t.welcomeNamed) : t.welcomeAnon;
    var h = '<div class="wrap">';
    h += '<header class="top"><div class="brand">Cosy Nest</div><div class="langs" role="group" aria-label="Language">' +
         LANGS.map(function(l){ return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === lang) + '" lang="' + l + '">' + T[l].name + '</button>'; }).join('') + '</div></header>';
    h += '<section class="hero"><h1>';
    if (loading && !names.length) h += esc(t.welcomeAnon[0]) + '<br><span class="skel"></span>';
    else h += esc(fill(w[0],{name:shown})) + '<br>' + esc(fill(w[1],{name:shown}));
    h += '</h1>' + [].concat(t.intro).map(function(x){ return '<p class="intro">' + esc(x).replace(D.hostPhone, telLink(D.hostPhone)) + '</p>'; }).join('') + '<p class="place">' + esc(t.place) + '</p>';
    if (stay && !qs.nom){
      var y = todayISO().slice(0,4), sameYear = stay.from.slice(0,4) === y && stay.to.slice(0,4) === y;
      h += '<p class="stay">' + esc(fill(t.stay,{from:fmtDate(stay.from,lang,!sameYear), to:fmtDate(stay.to,lang,!sameYear)})) + '</p>';
    }
    h += FLOURISH + '</section>';
    h += '<section class="card"><h2>Wi\u2011Fi</h2>';
    if (S.wifiName || S.wifiPass){
      if (S.wifiName) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v" id="wifiName">' + esc(S.wifiName) + '</span></div><button type="button" class="copy" data-copy="wifiName">' + esc(t.copy) + '</button></div>';
      if (S.wifiPass) h += '<div class="kv' + (S.wifiName ? '' : ' first') + '"><div><span class="k">' + esc(t.password) + '</span><span class="v" id="wifiPass">' + esc(S.wifiPass) + '</span></div><button type="button" class="copy" data-copy="wifiPass">' + esc(t.copy) + '</button></div>';
    } else if (loading) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v"><span class="skel"></span></span></div></div>';
    else h += todo('wifi');
    h += '</section><div class="topics">' + D.order.map(function(id){
      return '<details class="topic" data-id="' + id + '"><summary>' + esc(t.titles[id]) + '</summary><div class="body">' + render_blocks(id, lang, S) + '</div></details>';
    }).join('') + '</div>';
    h += '<footer class="bottom">Cosy Nest<br>Zur Gasse 87, 3954 Leukerbad<br><small>' + esc(t.privacy) + '</small></footer></div>';
    var app = document.getElementById('app');
    var open = {}; app.querySelectorAll('details.topic[open]').forEach(function(d){ open[d.dataset.id] = true; });
    if (map) { try { map.remove(); } catch(e){} map = null; }
    app.innerHTML = h;
    app.querySelectorAll('details.topic').forEach(function(d){
      if (open[d.dataset.id]) d.open = true;
      d.addEventListener('toggle', function(){ if (d.open && d.dataset.id === 'parking') initMap(lang); });
    });
    if (open.parking) initMap(lang);
    wire(lang);
  }

  var map = null;
  function initMap(lang){
    var el = document.getElementById('map');
    if (!el || map || !window.L) return;
    var t = T[lang];
    map = L.map(el, {scrollWheelZoom:false, attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
    var line = L.polyline(D.map.route, {color:'#2F6F79', weight:4, dashArray:'2 8', lineCap:'round'}).addTo(map);
    function pin(cls, label){ return L.divIcon({className:'', html:'<span class="pin ' + cls + '">' + label + '</span>', iconSize:[30,30], iconAnchor:[15,15]}); }
    L.marker(D.map.home, {icon: pin('home', '\u2302')}).addTo(map).bindPopup(esc(t.map_home));
    L.marker(D.map.park, {icon: pin('park', 'P')}).addTo(map).bindPopup(esc(t.map_park) + '<br>Römerweg 5');
    map.fitBounds(line.getBounds(), {padding:[40,40], maxZoom:17});
  }

  function wire(lang){
    var app = document.getElementById('app');
    app.querySelectorAll('.langs button').forEach(function(b){
      b.addEventListener('click', function(){ manualLang = b.dataset.lang; try { sessionStorage.setItem('cn-lang', manualLang); } catch(e){} render(); });
    });
    app.querySelectorAll('.copy').forEach(function(b){
      b.addEventListener('click', function(){
        var v = document.getElementById(b.dataset.copy).textContent;
        var done = function(){ var old = b.textContent; b.textContent = T[lang].copied; setTimeout(function(){ b.textContent = old; }, 1600); };
        try { navigator.clipboard.writeText(v).then(done, function(){}); } catch(e){}
      });
    });
  }

  function logVisit(){
    var who = qs.nom ? 'test' : '';
    try { if (!who && localStorage.getItem('cn-host')) who = 'hote'; } catch(e){}
    var url = (window.CN_CONFIG && window.CN_CONFIG.api) || ''; if (!url) return;
    var stay = currentStay(state.stays), ua = navigator.userAgent || '';
    var dev = /iPad|Tablet/i.test(ua) ? 'tablette' : (/Mobi|Android|iPhone/i.test(ua) ? 'mobile' : 'ordinateur');
    var lang = manualLang || (stay && LANGS.indexOf(stay.lang) >= 0 ? stay.lang : browserLang());
    var sent = false;
    function send(g){
      if (sent) return; sent = true; g = g || {};
      fetch(url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'visit', stay: stay ? namesOf(stay).join(', ') : '', city: g.city || '', region: g.region || '', country: g.country || '', device: dev, lang: lang, who: who})}).catch(function(){});
    }
    setTimeout(function(){ send({}); }, 5000);
    fetch('https://get.geojs.io/v1/ip/geo.json').then(function(r){ return r.json(); }).then(send, function(){ send({}); });
  }

  render();
  var settled = false;
  function settle(){ if (settled) return; settled = true; loading = false; render(); logVisit(); }
  setTimeout(settle, 6000);
  api('GET').then(function(data){
    if (data && Array.isArray(data.stays)){
      state = {stays: data.stays, settings: data.settings || {}};
      try { localStorage.setItem('cn-state', JSON.stringify(state)); } catch(e){}
    }
    settle();
  }, function(){ settle(); });
})();
</script>
</body>
</html>
