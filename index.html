      intro:'Vi auguriamo un ottimo soggiorno a Leukerbad. Qui trovate tutto quello che c\u2019è da sapere sullo studio e sulla regione.',
      place:'Studio 14, Haus Adlerhorst, Leukerbad',
      stay:'Il vostro soggiorno: dal {from} al {to}',
      network:'Rete', password:'Password', copy:'Copia', copied:'Copiato',

      intro:'Le deseamos una estancia estupenda en Leukerbad. Aquí encontrará todo lo que hay que saber sobre el estudio y la región.',
      place:'Estudio 14, Haus Adlerhorst, Leukerbad',
      stay:'Su estancia: del {from} al {to}',

      contact:'¿Alguna pregunta? Escríbanos en la app de Airbnb o Booking.',
      thanks:'Gracias por su visita. ¡Buen viaje de vuelta!'

  };

  /* Notes pour l'hôte (identiques dans toutes les langues, à remplacer par le vrai contenu) */
  var TODO = {
    times:'Heure d\u2019arrivée et heure de départ (Espace hôte → Réglages).',
    keys:'Remise des clés : boîte à clés, code, où déposer les clés au départ.',
    wifi:'Nom du réseau et mot de passe Wi\u2011Fi (Espace hôte → Réglages).',
    tv:'Mode d\u2019emploi de la TV : télécommande à utiliser, bouton source/HDMI, accès aux chaînes, Netflix ou YouTube, chaînes en langues étrangères.',
    trash:'Où se trouvent les poubelles de l\u2019immeuble, où acheter les sacs taxés, emplacement du point de tri, jours de ramassage.',
    parking:'Place privée ou parking public : nom, distance, tarif, règles en hiver (pneus neige, déneigement).',
    guestcard:'Comment la carte est remise (envoyée par nous, dans le studio) et liste exacte des avantages (bus local, réductions bains, remontées).',
    walks:'Vos balades préférées, temps de marche depuis le studio, activités selon la saison.',
    food:'3 à 5 restaurants recommandés : nom, spécialité, budget, distance, réservation conseillée ou non.',
    transport:'Arrêt de bus le plus proche du studio et temps de marche.',
    emergency:'Pharmacie, médecin et hôpital les plus proches.',
    checkout:'Consignes de départ : vaisselle, poubelles, fenêtres, chauffage, clés.'
  };

  var LANGS = ['fr','de','en','it','es'];
  var LOCALE = {fr:'fr-CH', de:'de-CH', en:'en-GB', it:'it-CH', es:'es-ES'};
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fill(tpl, vars){ return tpl.replace(/\{(\w+)\}/g, function(m,k){ return vars[k] != null ? vars[k] : m; }); }
  function todayISO(){
    try { return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zurich',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
    catch(e){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  }
  function fmtDate(iso, lang, withYear){
    try {
      var p = String(iso).split('-'); var d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
      var o = {day:'numeric', month:'long', timeZone:'UTC'}; if (withYear) o.year = 'numeric';
      return new Intl.DateTimeFormat(LOCALE[lang] || 'fr-CH', o).format(d);
    } catch(e){ return iso; }
  }
  function namesOf(s){ var n = Array.isArray(s.names) ? s.names : String(s.name || '').split(/\s*[,;]\s*/); return n.map(function(x){ return String(x).trim(); }).filter(Boolean); }
  function joinNames(names, lang){
    var conj = (T[lang] && T[lang].and) || 'et';
    if (names.length <= 1) return names[0] || '';
    if (lang === 'es' && /^(hi|i)/i.test(names[names.length-1]) && !/^hie/i.test(names[names.length-1])) conj = 'e';
    return names.slice(0,-1).join(', ') + ' ' + conj + ' ' + names[names.length-1];
  }
  function zurichHour(){
    try { return parseInt(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Zurich',hour:'numeric',hourCycle:'h23'}).format(new Date()), 10) || 0; }
    catch(e){ return new Date().getHours(); }
  }
  function pickStay(stays, today, hour){
    var c = (stays || []).filter(function(s){ return s.from && s.to && s.from <= today && today <= s.to; });
    if (c.length > 1){
      var leaving = c.filter(function(s){ return s.to === today; });
      var arriving = c.filter(function(s){ return s.from === today; });
      if (hour < 12 && leaving.length) return leaving[0];
      if (hour >= 12 && arriving.length) return arriving[0];
    }
    return c.sort(function(a,b){ return a.from < b.from ? 1 : -1; })[0] || null;
  }
  function currentStay(stays){ return pickStay(stays, todayISO(), zurichHour()); }
  function api(method, body){
    var url = (window.CN_CONFIG && window.CN_CONFIG.api) || '';
    if (!url) return Promise.reject({code:'no_api'});
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 15000);
    var opts = {method:method, redirect:'follow', cache:'no-store'};
    if (ctrl) opts.signal = ctrl.signal;
    if (method === 'POST'){ opts.body = JSON.stringify(body || {}); opts.headers = {'Content-Type':'text/plain;charset=utf-8'}; }
    var u = method === 'GET' ? url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now() : url;
    return fetch(u, opts).then(function(r){ return r.text(); }).then(function(txt){
      clearTimeout(timer);
      try { return JSON.parse(txt); } catch(e){ throw {code:'bad_response'}; }
    }, function(e){ clearTimeout(timer); throw {code: (e && e.name === 'AbortError') ? 'timeout' : 'network'}; });
  }

  var state = {stays:[], settings:{}};
  var loading = true;
  try { var cached = JSON.parse(localStorage.getItem('cn-state') || 'null'); if (cached && cached.stays) { state = cached; loading = false; } } catch(e){}

  var qs = {};
  try { location.search.slice(1).split('&').forEach(function(kv){ if(!kv) return; var p = kv.split('='); qs[decodeURIComponent(p[0])] = decodeURIComponent((p[1]||'').replace(/\+/g,' ')); }); } catch(e){}

  function browserLang(){
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++){ var l = String(list[i]).slice(0,2).toLowerCase(); if (LANGS.indexOf(l) >= 0) return l; }
    return 'en';
  }
  var manualLang = null;
  try { manualLang = sessionStorage.getItem('cn-lang'); } catch(e){}
  if (LANGS.indexOf(qs.lang) >= 0) manualLang = qs.lang;

  function todo(txt){ return '<div class="todo"><b>À compléter</b>' + esc(txt) + '</div>'; }
  function p(txt){ return '<p>' + esc(txt) + '</p>'; }

  function sectionBody(id, t, S){
    var h = '';
    if (id === 'arrival'){
      if (S.checkin && S.checkout) h += p(fill(t.checkin,{checkin:S.checkin}) + ' ' + fill(t.checkout,{checkout:S.checkout})); else h += todo(TODO.times);
      h += todo(TODO.keys);
    } else if (id === 'tv'){ h += todo(TODO.tv);
    } else if (id === 'trash'){ h += p(t.trash) + todo(TODO.trash);
    } else if (id === 'parking'){ if (S.parkingSpot) h += p(fill(t.spot,{spot:S.parkingSpot})); h += todo(TODO.parking);
    } else if (id === 'guestcard'){ h += p(t.guestcard) + todo(TODO.guestcard);
    } else if (id === 'walks'){ h += t.walks.map(p).join('') + todo(TODO.walks);
    } else if (id === 'food'){ h += todo(TODO.food);
    } else if (id === 'transport'){ h += p(t.transport) + todo(TODO.transport);
    } else if (id === 'emergency'){
      h += '<ul>' + t.emergency.map(function(e){ return '<li>' + esc(e[0]) + ' <a href="tel:' + esc(e[1]) + '">' + esc(e[1]) + '</a></li>'; }).join('') + '</ul>' + todo(TODO.emergency);
    } else if (id === 'contact'){
      if (S.hostPhone){
        var tel = String(S.hostPhone).replace(/[^+\d]/g,'');
        h += '<p>' + esc(fill(t.contactPhone,{phone:'\u0000'})).replace('\u0000', '<a href="tel:' + esc(tel) + '">' + esc(S.hostPhone) + '</a>') + '</p>';
      } else h += p(t.contact);
    } else if (id === 'checkout'){
      if (S.checkout) h += p(fill(t.checkout,{checkout:S.checkout}));
      h += todo(TODO.checkout) + p(t.thanks);
    }
    return h;
  }
  var ORDER = ['arrival','tv','trash','parking','guestcard','walks','food','transport','emergency','contact','checkout'];

  function render(){
    var S = state.settings || {};
    var stay = currentStay(state.stays);
    var names = qs.nom ? namesOf({name: qs.nom}) : (stay ? namesOf(stay) : []);
    var lang = manualLang || (stay && LANGS.indexOf(stay.lang) >= 0 ? stay.lang : browserLang());
    var t = T[lang];
    document.documentElement.lang = lang;
    var shown = joinNames(names, lang);
    var w = names.length ? ((names.length > 1 && t.welcomeNamedPlural) ? t.welcomeNamedPlural : t.welcomeNamed) : t.welcomeAnon;
    var h = '<div class="wrap">';
    h += '<header class="top"><div class="brand">Cosy Nest</div><div class="right">' +
         '<div class="langs" role="group" aria-label="Language">' +
         LANGS.map(function(l){ return '<button type="button" data-lang="' + l + '" aria-pressed="' + (l === lang) + '" lang="' + l + '">' + T[l].name + '</button>'; }).join('') +
         '</div></div></header>';
    h += '<section class="hero"><h1>';
    if (loading && !names.length) h += esc(t.welcomeAnon[0]) + '<br><span class="skel"></span>';
    else h += esc(fill(w[0],{name:shown})) + '<br>' + esc(fill(w[1],{name:shown}));
    h += '</h1>';
    h += '<p class="intro">' + esc(t.intro) + '</p>';
    h += '<p class="place">' + esc(t.place) + '</p>';
    if (stay && !qs.nom){
      var y = todayISO().slice(0,4);
      var sameYear = stay.from.slice(0,4) === y && stay.to.slice(0,4) === y;
      h += '<p class="stay">' + esc(fill(t.stay,{from:fmtDate(stay.from,lang,!sameYear), to:fmtDate(stay.to,lang,!sameYear)})) + '</p>';
    }
    h += '<svg class="ridge" viewBox="0 0 360 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M0 34 L42 20 L68 28 L108 7 L138 19 L176 3 L204 17 L242 9 L276 25 L312 13 L360 30"/></svg>';
    h += '</section>';
    h += '<section class="card"><h2>Wi\u2011Fi</h2>';
    if (S.wifiName || S.wifiPass){
      if (S.wifiName) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v" id="wifiName">' + esc(S.wifiName) + '</span></div><button type="button" class="copy" data-copy="wifiName">' + esc(t.copy) + '</button></div>';
      if (S.wifiPass) h += '<div class="kv' + (S.wifiName ? '' : ' first') + '"><div><span class="k">' + esc(t.password) + '</span><span class="v" id="wifiPass">' + esc(S.wifiPass) + '</span></div><button type="button" class="copy" data-copy="wifiPass">' + esc(t.copy) + '</button></div>';
    } else if (loading) h += '<div class="kv first"><div><span class="k">' + esc(t.network) + '</span><span class="v"><span class="skel"></span></span></div></div>';
    else h += todo(TODO.wifi);
    h += '</section>';
    h += '<div class="topics">' + ORDER.map(function(id){
      return '<details class="topic" data-id="' + id + '"><summary>' + esc(t.titles[id]) + '</summary><div class="body">' + sectionBody(id, t, S) + '</div></details>';
    }).join('') + '</div>';
    h += '<footer class="bottom">Cosy Nest<br>Zur Gasse 87, 3954 Leukerbad</footer>';
    h += '</div>';
    var app = document.getElementById('app');
    var open = {}; app.querySelectorAll('details.topic[open]').forEach(function(d){ open[d.dataset.id] = true; });
    app.innerHTML = h;
    app.querySelectorAll('details.topic').forEach(function(d){ if (open[d.dataset.id]) d.open = true; });
    wire(lang);
  }

  function wire(lang){
    var app = document.getElementById('app');
    app.querySelectorAll('.langs button').forEach(function(b){
      b.addEventListener('click', function(){ manualLang = b.dataset.lang; try { sessionStorage.setItem('cn-lang', manualLang); } catch(e){} render(); });
    });
    app.querySelectorAll('.copy').forEach(function(b){
      b.addEventListener('click', function(){
        var v = document.getElementById(b.dataset.copy).textContent;
        var done = function(){ var old = b.textContent; b.textContent = T[lang].copied; setTimeout(function(){ b.textContent = old; }, 1600); };
        try { navigator.clipboard.writeText(v).then(done, function(){ selectText(b.dataset.copy); }); } catch(e){ selectText(b.dataset.copy); }
      });
    });
  }
  function selectText(id){
    try { var r = document.createRange(); r.selectNodeContents(document.getElementById(id)); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){}
  }

  render();
  var settled = false;
  function settle(){ if (settled) return; settled = true; loading = false; render(); }
  setTimeout(settle, 6000);
  api('GET').then(function(data){
    if (data && Array.isArray(data.stays)){
      state = {stays: data.stays, settings: data.settings || {}};
      try { localStorage.setItem('cn-state', JSON.stringify(state)); } catch(e){}
    }
    settle();
  }, function(){ settle(); });
})();
</script>
</body>
</html>
